name: Keyboard validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the production toolchain and test image
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Install and verify emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libnss3 libgl1 libvulkan1 libx11-6 libx11-xcb1 libxcb1 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxi6 libxtst6 libdbus-1-3
          "$ANDROID_HOME/emulator/emulator" -no-metrics -version
      - name: Unit tests, lint and debug APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Boot an isolated emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/still-test-avd
        run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n still_test -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -avd still_test -accel on -memory 2048 -cores 2 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader -feature -Vulkan > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 3
          if ! kill -0 "$emulator_pid"; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          timeout 240 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          for attempt in $(seq 1 30); do
            if adb shell ime list -s | tr -d '\r' | grep -Fxq 'app.still.launcher/helium314.keyboard.latin.LatinIME'; then break; fi
            sleep 1
          done
          adb shell ime enable app.still.launcher/helium314.keyboard.latin.LatinIME
          adb shell ime set app.still.launcher/helium314.keyboard.latin.LatinIME
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell settings put secure spell_checker_enabled 1
          adb shell settings put secure selected_spell_checker app.still.launcher/helium314.keyboard.latin.spellcheck.AndroidSpellCheckerService
      - name: Real dictionary and code suggestion regressions
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.still.launcher.KeyboardSuggestionTest
      - name: Notification badges across launcher surfaces and Android access changes
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.still.launcher.NotificationBadgesIntegrationTest
      - name: Collect numbered badge screenshots
        run: adb pull /sdcard/Android/data/app.still.launcher/files/badge-screenshots badge-screenshots
      - name: Save badge screenshots and test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: numbered-badge-preview
          path: |
            badge-screenshots/
            app/build/reports/androidTests/connected/
          if-no-files-found: error
      - name: Emulator diagnostics
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/emulator.log" ]; then tail -150 "$RUNNER_TEMP/emulator.log"; fi
          adb devices -l
          if adb get-state >/dev/null 2>&1; then adb logcat -d -t 200; fi
          if adb get-state >/dev/null 2>&1; then adb logcat -d -s StillSuggestionTest:V AndroidWordLevelSpellCheckerSession:V DictionaryFacilitatorImpl:V AndroidRuntime:E; fi
